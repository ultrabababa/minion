name: "HotStuff Quick Baseline"
description: "Short 30-second baseline for smoke testing (no fault injection)"
secondaries: 5
threads: 2
bench:
  type: "simple"
  txs:
    0: 5
    30: 5
let:
  - &all_nodes
    sample: !endpoint [ ".*" ]
  - !loop &all_clients
    sample: !location [ ".*" ]
  - &account { sample: !account { number: 4, stake: 100 } }
workloads:
  - number: 5
    client:
      location: *all_clients
      view: *all_nodes
      behavior:
        - interaction: !transfer { from: *account, to: *account }
          load:
            0: 1
            30: 1
