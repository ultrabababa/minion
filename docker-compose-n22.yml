networks:
  stabl_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.0.0/16

x-node: &node
  image: stabl-node
  build:
    context: .
    dockerfile: Dockerfile
  cap_add:
    - NET_ADMIN
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  builder:
    <<: *node
    networks:
      stabl_net:
        ipv4_address: 10.30.30.2
  chain1:
    <<: *node
    networks:
      stabl_net:
        ipv4_address: 10.30.10.1
