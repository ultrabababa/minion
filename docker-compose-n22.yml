  runner:
    image: stabl-runner
    build:
      context: .
      dockerfile: Dockerfile.runner
    networks:
      stabl_net:
        ipv4_address: 10.30.40.1
    volumes:
      - ../:/project
    working_dir: /project
    user: ubuntu
    command: tail -f /dev/null
    logging:
      driver: json-file
      options:
        max-size: "10m"
