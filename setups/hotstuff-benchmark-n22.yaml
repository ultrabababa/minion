name: "HotStuff Fault Injection Benchmark (N=${N})"
description: "800-second benchmark for HotStuff with STABL fault injection (200 TPS total)"
secondaries: 5
threads: 2
bench:
  type: "simple"
  txs:
    0: 5
    800: 5
let:
  - &all_nodes
    sample: !endpoint [ ".*" ]
  - !loop &all_clients
    sample: !location [ ".*" ]
  - &account { sample: !account { number: 4, stake: 100 } }
workloads:
  - number: 5
    client:
      location: *all_clients
      view: *all_nodes
      behavior:
        - interaction: !transfer { from: *account, to: *account }
          load:
            0: 20
            800: 20
