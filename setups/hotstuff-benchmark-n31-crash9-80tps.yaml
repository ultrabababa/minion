name: "HotStuff N31 crash-no-recovery-9 80 TPS"
description: "800-second N31 benchmark at 80 TPS; client mempool view excludes the 9 permanently crashed nodes"
secondaries: 5
threads: 2
bench:
  type: "simple"
  txs:
    0: 5
    800: 5
let:
  - &live_mempool_nodes
    sample: !endpoint [ "10\\.30\\.10\\.([1-9]|1[0-9]|2[0-2])$" ]
  - !loop &all_clients
    sample: !location [ ".*" ]
  - &account { sample: !account { number: 4, stake: 100 } }
workloads:
  - number: 5
    client:
      location: *all_clients
      view: *live_mempool_nodes
      behavior:
        - interaction: !transfer { from: *account, to: *account }
          load:
            0: 16
            800: 16
